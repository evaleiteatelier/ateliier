<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico - Eva Leite Atelier</title>
  <link rel="stylesheet" href="style.css?v=2">
  <script src="auth-guard.js"></script>
</head>
<body>

  <div class="page-toolbar">
    <h1>Histórico</h1>

    <div class="page-toolbar-controls">
      <div class="filter-dropdown-wrap">
        <button type="button" class="btn-filter-icon" id="btn-filter-toggle" onclick="toggleFiltroPopover(event)" title="Filtros e Ordenação">
          <svg viewBox="0 0 24 24">
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="7" y1="12" x2="17" y2="12"></line>
            <line x1="10" y1="18" x2="14" y2="18"></line>
          </svg>
          <span class="filter-badge-dot"></span>
        </button>

        <div class="filter-popover" id="filter-popover-box">
          <div class="filter-popover-section">
            <span class="filter-popover-label">Ordenar por</span>
            <select id="ordem-pedidos" onchange="filtrarPedidos()">
              <option value="data-desc">Mais recente</option>
              <option value="data-asc">Mais antigo</option>
              <option value="nome-az">Nome (A → Z)</option>
              <option value="nome-za">Nome (Z → A)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="toolbar-search-wrap">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="pesquisa" placeholder="Pesquisar cliente..." onkeyup="filtrarPedidos()">
      </div>
    </div>
  </div>

  <div id="lista-entregues">
    <p>A carregar histórico...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="navbar.js?v=7"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
